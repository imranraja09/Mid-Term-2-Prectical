<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Product Store</title>
    <link rel="stylesheet" href="/Product Search And Filter/style.css">

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">⚡ EliteStore</a>
            <ul class="nav-links">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <button class="cart-badge-btn" id="cartToggleBtn">
                🛒 Cart <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>Explore Products</h1>
            <p>Discover our curated collection of modern essentials</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>

            <select class="custom-select" id="categorySelect">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="apparel">Apparel</option>
                <option value="lifestyle">Lifestyle</option>
            </select>

            <select class="custom-select" id="sortSelect">
                <option value="default">Sort by: Featured</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>

            <div class="grid-toggles">
                <button class="grid-btn active" data-grid="grid-2">2 Col</button>
                <button class="grid-btn" data-grid="grid-4">4 Col</button>
            </div>
        </div>

        <div class="product-grid grid-2" id="productGrid"></div>
    </div>

    <div class="modal-overlay" id="cartModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Your Shopping Cart</h2>
                <button class="close-modal" id="closeModal">×</button>
            </div>
            <div class="cart-items-list" id="cartItemsList"></div>
            <div class="modal-footer">
                <div class="cart-total">Total: $<span id="cartTotalPrice">0.00</span></div>
                <button class="checkout-btn" id="checkoutBtn">Checkout</button>
            </div>
        </div>
    </div>
<script src="/Product Search And Filter/main.js"></script>
</body>
</html>
